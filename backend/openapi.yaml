    title: SegmentService API
    description: |-
        SegmentService provides segment management and evaluation.

         ## Enum Values Reference
         Note: Both string names and numbers are accepted in JSON requests. Responses use string names.

         ### SegmentType
         - 1 = STATIC (Pre-computed user list)
         - 2 = DYNAMIC (Computed on-demand based on conditions)
         - 3 = COMPOSITE (Combines child segments)

         ### LogicalOperator
         - 1 = AND
         - 2 = OR

         ### ComparisonOperator
         - 1 = EQ (equals)
         - 2 = NEQ (not equals)
         - 3 = GT (greater than)
         - 4 = GTE (greater than or equals)
         - 5 = LT (less than)
         - 6 = LTE (less than or equals)
         - 7 = IN (in list)
         - 8 = NOT_IN (not in list)
         - 9 = BETWEEN (between range)
         - 10 = CONTAINS (contains substring)
         - 11 = NOT_CONTAINS
         - 12 = IS_NULL
         - 13 = IS_NOT_NULL

         ## User Condition Fields (user_activity_summary table)
         Predefined lookback windows: 1, 3, 7, 30, 90 days
         - is_active_1d, is_active_3d, is_active_7d, is_active_30d, is_active_90d
         - is_pu_1d, is_pu_3d, is_pu_7d, is_pu_30d, is_pu_90d
         - is_churned_1d, is_churned_3d, is_churned_7d, is_churned_30d, is_churned_90d

         ## User Condition Fields (users table)
         - platform: web_mobile, web_pc, app
         - country: Country code (VN, US, etc.)
         - language: Language code (vi, en, etc.)
         - os: Operating system (iOS, Android)
         - total_revenue: Lifetime revenue
         - total_purchases: Total purchase count
         - max_vip_level: Maximum VIP level achieved
         - first_seen: First activity timestamp
         - last_seen: Last activity timestamp

         ## Event Names (REQUIRED for eventConditions)
         - * (any event)
         - app_page_view: User activity tracking
         - pay: Payment/monetization events
         - churned: No activity check (predefined windows only)
