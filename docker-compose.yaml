version: '3.8'

services:
  segmentation:
    build: .
    container_name: mgp-segmentation
    ports:
      - "8000:8000"
      - "9001:9000"  # Changed to avoid conflict with ClickHouse native port
    depends_on:
      clickhouse:
        condition: service_healthy
    environment:
      - TZ=UTC
    volumes:
      - ./configs:/app/configs
    networks:
      - mgp-local
      - segmentation-internal

  clickhouse:
    image: clickhouse/clickhouse-server:23.8
    container_name: mgp-clickhouse-local
    ports:
      - "8123:8123"
      - "9100:9000"  # Native port mapped to 9100 to avoid conflicts
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./migrations:/docker-entrypoint-initdb.d
    environment:
      CLICKHOUSE_DB: segmentation
      CLICKHOUSE_USER: default
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8123/ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - mgp-local
      - segmentation-internal

volumes:
  clickhouse_data:

networks:
  # Connect to existing backend network
  mgp-local:
    external: true
    name: mgp-local-network
  # Internal network for segmentation services
  segmentation-internal:
    driver: bridge
